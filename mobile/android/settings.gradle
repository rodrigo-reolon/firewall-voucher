pluginManagement {
    val flutterRoot = System.getenv("FLUTTER_ROOT") ?: run {
        val properties = java.util.Properties()
        file("local.properties").use { properties.load(it.inputStream()) }
        properties.getProperty("flutter.sdk") ?: error("flutter.sdk not set in local.properties")
    }

    includeBuild("$flutterRoot/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.3.2" apply false
    id "org.jetbrains.kotlin.android" version "2.0.0" apply false
}

include ":app"
