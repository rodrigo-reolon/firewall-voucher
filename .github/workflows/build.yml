name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      
      - name: Create fresh Flutter project
        run: flutter create -t app --org com.guestwifi --project-name voucher build_project
      
      - name: Copy source code and dependencies
        run: |
          cp -r mobile/lib/* build_project/lib/
          cp mobile/pubspec.yaml build_project/
          rm -f build_project/test/widget_test.dart
      
      - name: Install dependencies
        run: |
          cd build_project
          flutter pub get
      
      - name: Build APK
        run: |
          cd build_project
          flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build_project/build/app/outputs/flutter-apk/app-release.apk
