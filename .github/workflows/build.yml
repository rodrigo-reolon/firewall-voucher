name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      
      - name: Create Flutter project and copy code
        run: |
          flutter create -t app --org com.guestwifi --project-name voucher temp_project
          cp -r mobile/lib/* temp_project/lib/
          cp mobile/pubspec.yaml temp_project/
      
      - name: Clean and Install dependencies
        run: |
          cd temp_project
          flutter clean
          rm -rf build .dart_tool android/.gradle
          flutter pub get
      
      - name: Build APK
        run: |
          cd temp_project
          flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: temp_project/build/app/outputs/flutter-apk/app-release.apk
